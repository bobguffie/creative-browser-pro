<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #toolbar { background: #252525; padding: 5px 10px; display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; border-bottom: 1px solid #444; z-index: 30; overflow-x: auto; min-height: 45px; flex-shrink: 0; }
        .tool-group { display: flex; gap: 6px; border-right: 1px solid #444; padding-right: 8px; align-items: center; flex-shrink: 0; }
        #main-area { display: flex; flex-grow: 1; position: relative; overflow: hidden; }
        #sidebar { width: 50px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; z-index: 25; overflow-y: auto; flex-shrink: 0; }
        .drawer { position: absolute; left: 50px; top: 0; bottom: 0; width: 240px; background: #1e1e1e; border-right: 1px solid #444; transform: translateX(-100%); transition: 0.3s; z-index: 20; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); overflow-y: auto; }
        .drawer.open { transform: translateX(0); }
        #canvas-container { flex-grow: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; width: 100%; height: 100%; }
        canvas { border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        button, select, input { background: #444; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        button:hover { border-color: #00ff00; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .side-btn { width: 34px; height: 34px; font-size: 16px; background: transparent; border: 1px solid transparent; flex-shrink: 0; }
        .active { border-color: #00ff00 !important; color: #00ff00 !important; box-shadow: 0 0 5px #00ff00; }
        .slider-wrap { display: flex; flex-direction: column; gap: 2px; margin-bottom: 3px; }
        label { font-size: 9px; color: #888; text-transform: uppercase; font-weight: bold; }
        #layer-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .layer-item { padding: 8px; background: #2a2a2a; margin-bottom: 4px; border-radius: 4px; font-size: 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid transparent; }
        .layer-item:hover { background: #333; }
        .layer-item.selected { border-color: #00ff00; background: #333; }
        .layer-actions { display: flex; gap: 4px; margin-left: auto; }
        .layer-btn { padding: 2px 4px; background: transparent; border: none; font-size: 12px; }
        #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(20,20,20,0.95); color: #e8e8e8; border: 1px solid #00ff00; padding: 8px 16px; border-radius: 6px; font-size: 11px; z-index: 999; transition: transform 0.25s ease; max-width: 80%; text-align: center; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toolbar">
        <div class="tool-group">
            <button onclick="undo()" title="Undo">↩️</button>
            <button onclick="redo()" title="Redo">↪️</button>
        </div>
        <div class="tool-group">
            <button onclick="moveLayer('front')" title="Bring to Front">🔼</button>
            <button onclick="moveLayer('back')" title="Send to Back">🔽</button>
        </div>
        <div class="tool-group">
            <label>Fill</label>
            <input type="color" id="fillColor" value="#00ff00" onchange="updateStyle('fill', this.value)">
            <label>Opacity</label>
            <input type="range" min="0" max="1" step="0.1" value="1" style="width: 60px" oninput="updateStyle('opacity', parseFloat(this.value))">
        </div>
        <div class="tool-group">
            <button onclick="sliceGroup()" title="Slice Selection">✂️ Slice</button>
            <button onclick="weldObjects()" title="Weld">🔗</button>
            <button onclick="unweldObjects()" title="Unweld">🔓</button>
        </div>
        <div class="tool-group">
            <button id="eraserBtn" onclick="toggleEraser()" title="Eraser">🧽</button>
            <button onclick="toggleFullscreen()" title="Fullscreen">🖥️</button>
        </div>
        <div class="tool-group">
            <button onclick="document.getElementById('fileInput').click()" style="background:#007bff">📁 Import</button>
            <input type="file" id="fileInput" hidden accept="image/*" onchange="importLocalMedia(event)">
            <button id="removeBgBtn" onclick="removeBackground()" title="Select an image first" disabled style="background:#8a2be2">✨ Remove BG</button>
            <button onclick="refreshWorkspace()" style="background:#dc3545">🔄 Refresh Workspace</button>
        </div>
        <div class="tool-group" style="border:none">
            <button onclick="exportImage('png')" style="background:#28a745">💾 Save</button>
            <button onclick="deleteObject()" style="color:#ff4444">🗑️</button>
        </div>
    </div>

    <div id="main-area">
        <div id="sidebar">
            <button class="side-btn" id="shapesBtn" onclick="toggleDrawer('shapesDrawer')" title="Shapes">⭐</button>
            <button class="side-btn" id="textBtn" onclick="toggleDrawer('textDrawer')" title="Text">🔤</button>
            <button class="side-btn" id="brushBtn" onclick="toggleDrawer('brushDrawer')" title="Brushes">🖌️</button>
            <button class="side-btn" id="selectBtn" onclick="toggleDrawer('selectDrawer')" title="Selection">🎯</button>
            <button class="side-btn" id="adjustBtn" onclick="toggleDrawer('adjustDrawer')" title="Adjustments">🌓</button>
            <button class="side-btn" id="aiBtn" onclick="toggleDrawer('localAiDrawer')" title="Local AI">✨</button>
            <button class="side-btn" id="layersBtn" onclick="toggleDrawer('layersDrawer')" title="Layers">📂</button>
            <button class="side-btn" id="canvasBtn" onclick="toggleDrawer('canvasDrawer')" title="Canvas">🖼️</button>
            <button class="side-btn" id="lockBtn" onclick="toggleLock()" title="Lock">🔒</button>
            <button class="side-btn" id="snapBtn" onclick="toggleSnap()" title="Snap">📏</button>
        </div>

        <div id="textDrawer" class="drawer">
            <label>Text Settings</label>
            <div class="slider-wrap">
                <label>Font Family</label>
                <select id="fontFamily" onchange="updateTextProperty('fontFamily', this.value)">
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Impact">Impact</option>
                    <option value="Comic Sans MS">Comic Sans MS</option>
                </select>
            </div>
            <div class="slider-wrap">
                <label>Font Size</label>
                <input type="range" min="10" max="200" value="40" id="fontSize" oninput="updateTextProperty('fontSize', parseInt(this.value))">
            </div>
            <div class="slider-wrap">
                <label>Text Color</label>
                <input type="color" id="textColor" value="#ffffff" onchange="updateTextProperty('fill', this.value)">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                <button onclick="toggleTextStyle('bold')"><b>B</b></button>
                <button onclick="toggleTextStyle('italic')"><i>I</i></button>
                <button onclick="toggleTextStyle('underline')"><u>U</u></button>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 5px;">
                <button onclick="updateTextProperty('textAlign', 'left')">Left</button>
                <button onclick="updateTextProperty('textAlign', 'center')">Center</button>
                <button onclick="updateTextProperty('textAlign', 'right')">Right</button>
            </div>
            <hr style="border:0; border-top:1px solid #444;">
            <button onclick="addText()" style="background:#007bff; width: 100%;">+ Add New Text</button>
        </div>

        <div id="brushDrawer" class="drawer">
            <label>Brushes & Pencils</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button onclick="setBrush('Pencil')">✏️ Pencil</button>
                <button onclick="setBrush('Circle')">⭕ Circle</button>
                <button onclick="setBrush('Spray')">💨 Spray</button>
                <button onclick="setBrush('Pattern')">🏁 Pattern</button>
            </div>
            <div class="slider-wrap">
                <label>Brush Size</label>
                <input type="range" min="1" max="100" value="10" id="brushSize" oninput="updateBrush()">
            </div>
            <div class="slider-wrap">
                <label>Brush Color</label>
                <input type="color" id="brushColor" value="#00ff00" onchange="updateBrush()">
            </div>
            <div class="slider-wrap" id="patternSelectWrap" style="display:none">
                <label>Pattern</label>
                <select id="brushPattern" onchange="updateBrush()">
                    <option value="checkerboard">Checkerboard</option>
                    <option value="dots">Dots</option>
                    <option value="stripes">Stripes</option>
                </select>
            </div>
            <div class="slider-wrap">
                <label>Mode</label>
                <select id="brushMode" onchange="updateBrush()">
                    <option value="continuous">Continuous</option>
                    <option value="stamp">Stamp (Click)</option>
                </select>
            </div>
            <button onclick="toggleDrawingMode()" id="drawModeBtn">Start Drawing</button>
        </div>

        <div id="selectDrawer" class="drawer">
            <label>Selection Tools</label>
            <button onclick="stopAllTools()" id="pointerBtn" class="active">🖱️ Selection Pointer</button>
            <button onclick="startRectSelect()">⬛ Rect Mask Shape</button>
            <button onclick="startLassoSelect()">➰ Cutout Helper</button>
            <hr style="border:0; border-top:1px solid #444;">
            <label>Retouching</label>
            <div class="slider-wrap">
                <label>Tool Size</label>
                <input type="range" min="5" max="200" value="50" id="retouchSize" oninput="updateRetouchPreview()">
            </div>
            <button onclick="startCloneStamp()" id="cloneBtn">🩹 Clone Stamp</button>
            <button onclick="startSpotHealing()" id="healBtn">✨ Spot Healing</button>
            <p style="font-size: 8px; color: #888;">Clone: Alt+Click to source, then click to paint. Esc exits any tool.</p>
        </div>

        <div id="shapesDrawer" class="drawer">
            <label>Add Elements</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button onclick="addRect()">⬛ Rect</button>
                <button onclick="addCircle()">⭕ Circle</button>
                <button onclick="addTriangle()">🔺 Triangle</button>
                <button onclick="addStar()">⭐ Star</button>
                <button onclick="addHexagon()">⬢ Hexagon</button>
                <button onclick="addHeart()">❤️ Heart</button>
                <button onclick="addPentagon()">⬠ Pentagon</button>
                <button onclick="addOctagon()">🛑 Octagon</button>
                <button onclick="addCloud()">☁️ Cloud</button>
            </div>
            <hr style="border:0; border-top:1px solid #444;">
            <label>Image Frames (Drop Target)</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button onclick="addFrameShape('circle')">⭕ Circle Frame</button>
                <button onclick="addFrameShape('star')">⭐ Star Frame</button>
                <button onclick="addFrameShape('heart')">❤️ Heart Frame</button>
                <button onclick="addFrameShape('rect')">⬛ Rect Frame</button>
            </div>
            <hr style="border:0; border-top:1px solid #444;">
            <label>Frames</label>
            <button onclick="addFrame('classic')">🖼️ Classic Frame</button>
            <button onclick="addFrame('modern')">🔳 Modern Border</button>
            <button onclick="addFrame('polaroid')">📸 Polaroid</button>
            <hr style="border:0; border-top:1px solid #444;">
            <button onclick="addText()" style="background:#007bff">T Add Text</button>
        </div>

        <div id="adjustDrawer" class="drawer">
            <label>Manual Tools</label>
            <div class="slider-wrap"><label>Eraser Size</label><input type="range" min="1" max="100" value="20" id="eraserSize" oninput="if(isEraserMode) document.getElementById('eraserSizeVal')"></div>
            <button onclick="startColorKey()" style="margin-bottom: 5px;">🎯 Color Key (One-Click BG)</button>
            <p style="font-size: 8px; color: #888; margin: 0 0 10px 0;">Click a color on the image to make it transparent.</p>

            <label>Filters</label>
            <div class="slider-wrap"><label>Brightness</label><input type="range" min="-1" max="1" step="0.05" value="0" id="bS" oninput="applyFilters()"></div>
            <div class="slider-wrap"><label>Contrast</label><input type="range" min="-1" max="1" step="0.05" value="0" id="cS" oninput="applyFilters()"></div>
            <div class="slider-wrap"><label>Saturation</label><input type="range" min="-1" max="1" step="0.05" value="0" id="sS" oninput="applyFilters()"></div>
            <div class="slider-wrap"><label>Blur</label><input type="range" min="0" max="1" step="0.05" value="0" id="blS" oninput="applyFilters()"></div>

            <hr style="border:0; border-top:1px solid #444;">
            <label>Quick Presets</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button onclick="setFilterPreset('grayscale')">Grayscale</button>
                <button onclick="setFilterPreset('sepia')">Sepia</button>
                <button onclick="setFilterPreset('invert')">Invert</button>
                <button onclick="setFilterPreset('none')">Reset</button>
            </div>
        </div>

        <div id="layersDrawer" class="drawer"><label>Layers</label><ul id="layer-list"></ul></div>

        <div id="localAiDrawer" class="drawer">
            <label>Local AI (on-device, private)</label>
            <p style="font-size: 8px; color: #888; margin: 0;">First use downloads the AI engine (~100-200MB, then cached for offline use).</p>
            <button id="aiRemoveBgLocalBtn" onclick="localAiRemoveBg()" disabled>🪄 Remove Background (Local AI)</button>
            <button id="aiMagicLayersBtn" onclick="localAiMagicLayers()" disabled>🧩 Split into Magic Layers (Local AI)</button>
            <div id="aiDeviceWrap" style="display:flex; align-items:center; gap:6px;">
                <button id="aiGearBtn" onclick="toggleAiGear()" title="Execution environment">⚙️</button>
                <span id="aiDeviceLabel" style="font-size: 9px; color: #888;">Engine: Auto</span>
            </div>
            <div id="aiGearMenu" style="display:none; border:1px solid #444; border-radius:4px; padding:6px; background:#252525;">
                <label style="font-size:8px; color:#888;">EXECUTION ENVIRONMENT</label>
                <button onclick="setDeviceMode('auto')" id="devBtn-auto">Auto (default)</button>
                <button onclick="setDeviceMode('gpu')" id="devBtn-gpu">GPU Only (WebGPU)</button>
                <button onclick="setDeviceMode('cpu')" id="devBtn-cpu">CPU Only (battery friendly)</button>
                <p id="aiProbeInfo" style="font-size:8px; color:#666; margin:4px 0 0 0;"></p>
            </div>
            <div id="aiProgressBar" style="display:none; height:6px; background:#333; border-radius:3px; overflow:hidden;">
                <div id="aiProgressFill" style="height:100%; width:0%; background:#00ff00; transition: width 0.2s;"></div>
            </div>
            <p id="aiStatus" style="font-size: 9px; color: #00ff00; margin: 0; min-height: 12px;"></p>
        </div>

        <div id="canvasDrawer" class="drawer">
            <label>Canvas Dimensions (manual; window resize auto-fits)</label>
            <div class="slider-wrap"><label>Width</label><input type="number" id="canvW" value="1000" onchange="setManualCanvasSize()"></div>
            <div class="slider-wrap"><label>Height</label><input type="number" id="canvH" value="800" onchange="setManualCanvasSize()"></div>
            <hr style="border:0; border-top:1px solid #444;">
            <label>Canvas Color</label>
            <input type="color" value="#1a1a1a" oninput="canvas.setBackgroundColor(this.value); canvas.renderAll(); saveHistory();">
        </div>

        <div id="canvas-container"><canvas id="c"></canvas></div>
    </div>

    <div id="toast"></div>

    <script src="./vendor/fabric.min.js"></script>
    <script>
        // ============ STATE ============
        let canvas;
        let history = [], historyStep = -1;
        let isRestoring = false;      // suppress history while loading/restoring/adding previews
        let snapToGrid = false;
        let isEraserMode = false;
        let cloneSource = null;
        let retouchPreview = null;
        let activeRetouchTool = null; // 'clone' | 'heal'
        let colorKeyPending = false;
        let brushMode = 'continuous';

        // ============ TOASTS (replaces blocking alert()) ============
        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) { console.log('[toast]', msg); return; }
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // ============ CANVAS INIT (single owner of canvas + all event wiring) ============
        function initCanvas() {
            if (canvas) { canvas.dispose(); canvas = null; }
            const container = document.getElementById('canvas-container');
            container.innerHTML = '<canvas id="c"></canvas>';

            canvas = new fabric.Canvas('c', {
                width: container.clientWidth || 800,
                height: container.clientHeight || 600,
                backgroundColor: '#1a1a1a',
                selection: true
            });

            // All event wiring lives here, where `canvas` definitely exists.
            // History records adds, edits AND removals; bursts (e.g. slice's
            // add-two-remove-two) collapse into one undo step via the debounce.
            canvas.on('object:added', scheduleHistoryPush);
            canvas.on('object:modified', scheduleHistoryPush);
            canvas.on('object:removed', scheduleHistoryPush);
            canvas.on('mouse:down', handleMouseDown);
            canvas.on('mouse:move', handleMouseMove);
            canvas.on('mouse:dblclick', handleDblClick);
            canvas.on('object:moving', handleMoving);
            canvas.on('selection:created', syncRemoveBgButton);
            canvas.on('selection:updated', syncRemoveBgButton);
            canvas.on('selection:cleared', syncRemoveBgButton);
            canvas.on('object:added', syncRemoveBgButton);
            canvas.on('object:removed', syncRemoveBgButton);
            canvas.on('mouse:up', syncRemoveBgButton);   // programmatic setActiveObject doesn't fire selection events

            resizeCanvas();
            pushHistory();
        }

        // ============ RESIZE (the ONLY resize system) ============
        // Canvas always matches its container quadrant: no distortion, no overflow.
        function resizeCanvas() {
            if (!canvas) return;
            const container = document.getElementById('canvas-container');
            if (!container) return;
            const w = Math.max(50, container.clientWidth - 20);
            const h = Math.max(50, container.clientHeight - 20);
            if (canvas.getWidth() !== w || canvas.getHeight() !== h) {
                canvas.setDimensions({ width: w, height: h });
            }
            canvas.calcOffset();
            canvas.requestRenderAll();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);

        function setManualCanvasSize() {
            if (!canvas) return;
            const w = parseInt(document.getElementById('canvW').value) || canvas.getWidth();
            const h = parseInt(document.getElementById('canvH').value) || canvas.getHeight();
            canvas.setDimensions({ width: w, height: h });
            canvas.requestRenderAll();
            saveHistory();
        }

        // ============ HISTORY ============
        let historyTimer = null;
        function scheduleHistoryPush() {
            if (isRestoring) return;
            clearTimeout(historyTimer);
            historyTimer = setTimeout(() => { if (!isRestoring) pushHistory(); }, 60);
        }

        function pushHistory() {
            if (isRestoring || !canvas) return;
            const json = JSON.stringify(canvas.toJSON());
            if (history[historyStep] === json) { updateLayerList(); return; }
            history = history.slice(0, historyStep + 1);
            history.push(json);
            historyStep++;
            updateLayerList();
        }

        function saveHistory() { pushHistory(); }

        function restoreStep(step) {
            if (step < 0 || step >= history.length || !canvas) return;
            isRestoring = true;
            historyStep = step;
            canvas.loadFromJSON(history[step], () => {
                canvas.renderAll();
                isRestoring = false;
                updateLayerList();
                syncRemoveBgButton();
            });
        }

        function undo() { if (historyStep > 0) restoreStep(historyStep - 1); }
        function redo() { if (historyStep < history.length - 1) restoreStep(historyStep + 1); }

        // ============ UNIFIED POINTER INPUT ============
        // One dispatcher: color-key click, clone stamp, spot healing, stamp brush.
        function handleMouseDown(opt) {
            const pointer = canvas.getPointer(opt.e);

            if (colorKeyPending) {
                colorKeyPending = false;
                applyColorKeyAt(pointer);
                return;
            }
            if (activeRetouchTool === 'clone') {
                cloneAt(opt, pointer);
                return;
            }
            if (activeRetouchTool === 'heal') {
                healAt(pointer);
                return;
            }
            if (canvas.isDrawingMode && brushMode === 'stamp') {
                stampAt(pointer);
            }
        }

        function handleMouseMove(opt) {
            if (retouchPreview) {
                const pointer = canvas.getPointer(opt.e);
                retouchPreview.set({ left: pointer.x, top: pointer.y });
                canvas.bringToFront(retouchPreview);
                canvas.requestRenderAll();
                return;
            }
            if (isEraserMode) {
                eraseAtPointer(canvas.getPointer(opt.e));
            }
        }

        // ============ TOOLS ============
        function stopAllTools() {
            if (!canvas) return;
            canvas.isDrawingMode = false;
            isEraserMode = false;
            activeRetouchTool = null;
            colorKeyPending = false;
            cloneSource = null;
            if (retouchPreview) { canvas.remove(retouchPreview); retouchPreview = null; }
            document.querySelectorAll('.drawer button, #toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById('pointerBtn').classList.add('active');
            canvas.defaultCursor = 'default';
            canvas.hoverCursor = 'move';
            canvas.requestRenderAll();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { stopAllTools(); showToast('Tools reset.'); }
        });

        function updateRetouchPreview() {
            if (!retouchPreview) return;
            const size = parseInt(document.getElementById('retouchSize').value);
            retouchPreview.set({ radius: size / 2, width: size, height: size });
            canvas.requestRenderAll();
        }

        function createRetouchPreview() {
            if (retouchPreview) canvas.remove(retouchPreview);
            const size = parseInt(document.getElementById('retouchSize').value);
            retouchPreview = new fabric.Circle({
                radius: size / 2,
                fill: 'rgba(0, 255, 0, 0.2)',
                stroke: '#00ff00',
                strokeWidth: 1,
                strokeDashArray: [3, 3],
                selectable: false,
                evented: false,
                originX: 'center',
                originY: 'center',
                excludeFromExport: true
            });
            isRestoring = true;
            canvas.add(retouchPreview);
            isRestoring = false;
        }

        function startCloneStamp() {
            stopAllTools();
            activeRetouchTool = 'clone';
            document.getElementById('cloneBtn').classList.add('active');
            document.getElementById('pointerBtn').classList.remove('active');
            createRetouchPreview();
            showToast('Clone Stamp: Alt+Click to set source, then click to paint. Esc to exit.');
        }

        function startSpotHealing() {
            stopAllTools();
            activeRetouchTool = 'heal';
            document.getElementById('healBtn').classList.add('active');
            document.getElementById('pointerBtn').classList.remove('active');
            createRetouchPreview();
            showToast('Spot Healing: click a blemish to blend it. Esc to exit.');
        }

        function topImageAt(pointer) {
            const imgs = canvas.getObjects().filter(o => o.type === 'image' && o.visible && o !== retouchPreview && o.containsPoint(pointer));
            return imgs[imgs.length - 1];
        }

        function cloneAt(opt, pointer) {
            if (opt.e.altKey) {
                cloneSource = pointer;
                showToast('Clone source set.');
                return;
            }
            if (!cloneSource) { showToast('Alt+Click first to set the clone source.'); return; }
            const size = parseInt(document.getElementById('retouchSize').value);
            const sourceObj = topImageAt(cloneSource);
            if (!sourceObj) { showToast('No image under the source point.'); return; }
            sourceObj.clone((cloned) => {
                const clip = new fabric.Circle({
                    radius: size / 2,
                    left: cloneSource.x,
                    top: cloneSource.y,
                    originX: 'center',
                    originY: 'center',
                    absolutePositioned: true
                });
                cloned.set({
                    clipPath: clip,
                    left: pointer.x,
                    top: pointer.y,
                    originX: 'center',
                    originY: 'center'
                });
                canvas.add(cloned);
                saveHistory();
            });
        }

        function healAt(pointer) {
            const size = parseInt(document.getElementById('retouchSize').value);
            const active = topImageAt(pointer);
            if (!active) return;
            active.clone((cloned) => {
                const clip = new fabric.Circle({
                    radius: size / 2,
                    left: pointer.x,
                    top: pointer.y,
                    originX: 'center',
                    originY: 'center',
                    absolutePositioned: true
                });
                cloned.set({
                    clipPath: clip,
                    left: pointer.x,
                    top: pointer.y,
                    originX: 'center',
                    originY: 'center',
                    opacity: 0.8
                });
                cloned.filters.push(new fabric.Image.filters.Blur({ blur: 0.1 }));
                cloned.applyFilters();
                canvas.add(cloned);
                saveHistory();
            });
        }

        // Eraser: erase pixels directly on the underlying image (works over images;
        // over empty canvas it draws nothing). Uses destination-out circles.
        function eraseAtPointer(pointer) {
            const size = parseInt(document.getElementById('eraserSize').value) || 20;
            const img = topImageAt(pointer);
            if (!img) return;
            const el = img.getElement();
            if (!el) return;
            if (!img.__eraseCanvas) {
                const tmp = document.createElement('canvas');
                tmp.width = el.naturalWidth || el.width;
                tmp.height = el.naturalHeight || el.height;
                tmp.getContext('2d').drawImage(el, 0, 0);
                img.__eraseCanvas = tmp;
            }
            const tmp = img.__eraseCanvas;
            const tctx = tmp.getContext('2d');
            const lp = img.toLocalPoint({ x: pointer.x, y: pointer.y }, 'center', 'center');
            const sx = tmp.width / img.width, sy = tmp.height / img.height;
            tctx.globalCompositeOperation = 'destination-out';
            tctx.beginPath();
            tctx.arc((lp.x + img.width / 2) * sx, (lp.y + img.height / 2) * sy, (size / 2) * Math.abs(img.scaleX) * sx, 0, Math.PI * 2);
            tctx.fill();
            img.setElement(tmp);
            img.dirty = true;
            canvas.requestRenderAll();
        }

        function toggleEraser() {
            isEraserMode = !isEraserMode;
            canvas.isDrawingMode = isEraserMode;
            if (isEraserMode) {
                if (retouchPreview) { canvas.remove(retouchPreview); retouchPreview = null; }
                activeRetouchTool = null;
                document.getElementById('eraserBtn').classList.add('active');
                document.getElementById('drawModeBtn').classList.remove('active');
                showToast('Eraser: drag over an image to erase. Esc to exit.');
            } else {
                document.getElementById('eraserBtn').classList.remove('active');
            }
        }

        function toggleDrawingMode() {
            canvas.isDrawingMode = !canvas.isDrawingMode;
            isEraserMode = false;
            document.getElementById('eraserBtn').classList.remove('active');
            const btn = document.getElementById('drawModeBtn');
            btn.classList.toggle('active', canvas.isDrawingMode);
            btn.innerText = canvas.isDrawingMode ? "Stop Drawing" : "Start Drawing";
            if (canvas.isDrawingMode) updateBrush();
        }

        function setBrush(type) {
            if (type === 'Pencil') canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            if (type === 'Circle') canvas.freeDrawingBrush = new fabric.CircleBrush(canvas);
            if (type === 'Spray') canvas.freeDrawingBrush = new fabric.SprayBrush(canvas);
            if (type === 'Pattern') {
                canvas.freeDrawingBrush = new fabric.PatternBrush(canvas);
                document.getElementById('patternSelectWrap').style.display = 'block';
            } else {
                document.getElementById('patternSelectWrap').style.display = 'none';
            }
            updateBrush();
        }

        function updateBrush() {
            if (!canvas.freeDrawingBrush) return;
            const size = parseInt(document.getElementById('brushSize').value);
            const color = document.getElementById('brushColor').value;
            brushMode = document.getElementById('brushMode').value;

            canvas.freeDrawingBrush.width = size;
            canvas.freeDrawingBrush.color = color;
            canvas.freeDrawingBrush.globalCompositeOperation = 'source-over';

            if (canvas.freeDrawingBrush instanceof fabric.PatternBrush) {
                const patternType = document.getElementById('brushPattern').value;
                const patternCanvas = document.createElement('canvas');
                patternCanvas.width = patternCanvas.height = 20;
                const pCtx = patternCanvas.getContext('2d');
                pCtx.fillStyle = color;

                if (patternType === 'checkerboard') {
                    pCtx.fillRect(0, 0, 10, 10);
                    pCtx.fillRect(10, 10, 10, 10);
                } else if (patternType === 'dots') {
                    pCtx.beginPath();
                    pCtx.arc(10, 10, 5, 0, Math.PI * 2);
                    pCtx.fill();
                } else if (patternType === 'stripes') {
                    pCtx.fillRect(0, 0, 20, 5);
                    pCtx.fillRect(0, 10, 20, 5);
                }

                canvas.freeDrawingBrush.source = patternCanvas;
            }
        }

        function stampAt(pointer) {
            const color = document.getElementById('brushColor').value;
            const size = parseInt(document.getElementById('brushSize').value);
            if (canvas.freeDrawingBrush instanceof fabric.CircleBrush) {
                canvas.add(new fabric.Circle({
                    left: pointer.x, top: pointer.y, radius: size / 2, fill: color, originX: 'center', originY: 'center'
                }));
            } else if (canvas.freeDrawingBrush instanceof fabric.SprayBrush) {
                for (let i = 0; i < 20; i++) {
                    const r = Math.random() * size;
                    const a = Math.random() * Math.PI * 2;
                    canvas.add(new fabric.Circle({
                        left: pointer.x + r * Math.cos(a),
                        top: pointer.y + r * Math.sin(a),
                        radius: Math.random() * 2,
                        fill: color
                    }));
                }
            } else {
                canvas.add(new fabric.Circle({
                    left: pointer.x, top: pointer.y, radius: size / 2, fill: color, originX: 'center', originY: 'center'
                }));
            }
        }

        // ============ COLOR KEY ============
        function startColorKey() {
            const active = canvas.getActiveObject();
            if (!active || active.type !== 'image') {
                showToast('Select an image first.');
                return;
            }
            colorKeyPending = true;
            showToast('Click a color on the image to make it transparent.');
        }

        function applyColorKeyAt(pointer) {
            const img = topImageAt(pointer);
            if (!img) { showToast('Click on the image itself.'); return; }
            const el = img.getElement();
            if (!el) return;
            const tmp = document.createElement('canvas');
            tmp.width = el.naturalWidth || el.width;
            tmp.height = el.naturalHeight || el.height;
            const tctx = tmp.getContext('2d');
            tctx.drawImage(el, 0, 0);
            const lp = img.toLocalPoint({ x: pointer.x, y: pointer.y }, 'center', 'center');
            const px = Math.round((lp.x + img.width / 2) * (tmp.width / img.width));
            const py = Math.round((lp.y + img.height / 2) * (tmp.height / img.height));
            const d = tctx.getImageData(px, py, 1, 1).data;
            const color = `rgb(${d[0]},${d[1]},${d[2]})`;
            img.filters.push(new fabric.Image.filters.RemoveColor({ color: color, distance: 0.1 }));
            img.applyFilters();
            canvas.requestRenderAll();
            saveHistory();
            showToast('Color keyed: ' + color);
        }

        // ============ MASK EDITING (double-click frame masks) ============
        function handleDblClick(options) {
            const obj = options.target;
            if (obj && obj.clipPath) {
                const isEditing = !!obj.isEditingMask;
                obj.isEditingMask = !isEditing;

                if (obj.isEditingMask) {
                    const objMatrix = obj.calcTransformMatrix();
                    const relMaskMatrix = obj.clipPath.calcTransformMatrix();
                    const absMaskMatrix = fabric.util.multiplyTransformMatrices(objMatrix, relMaskMatrix);
                    const absMaskPos = fabric.util.transformPoint({ x: 0, y: 0 }, absMaskMatrix);

                    obj.clipPath.set({
                        absolutePositioned: true,
                        left: absMaskPos.x,
                        top: absMaskPos.y,
                        originX: 'center',
                        originY: 'center'
                    });

                    obj.set({
                        borderColor: '#00ff00',
                        borderDashArray: [5, 5],
                        cornerColor: '#00ff00'
                    });
                    showToast("Edit Mode: move the image inside the frame. Double-click again to lock.");
                } else {
                    const objMatrixInv = fabric.util.invertTransform(obj.calcTransformMatrix());
                    const absMaskMatrix = obj.clipPath.calcTransformMatrix();
                    const absMaskPos = fabric.util.transformPoint({ x: 0, y: 0 }, absMaskMatrix);
                    const relMaskPos = fabric.util.transformPoint(absMaskPos, objMatrixInv);

                    obj.clipPath.set({
                        absolutePositioned: false,
                        left: relMaskPos.x,
                        top: relMaskPos.y,
                        originX: 'center',
                        originY: 'center'
                    });

                    obj.set({
                        borderColor: 'rgb(178,204,255)',
                        borderDashArray: null,
                        cornerColor: 'rgb(178,204,255)'
                    });
                }
                canvas.requestRenderAll();
            }
        }

        function handleMoving(o) {
            if (snapToGrid) {
                o.target.set({
                    left: Math.round(o.target.left / 25) * 25,

        }

        // ============ LAYERS ============
        function updateLayerList() {
            const list = document.getElementById('layer-list');
            if (!list || !canvas) return;
            list.innerHTML = '';
            const activeObj = canvas.getActiveObject();

            canvas.getObjects().filter(o => o !== retouchPreview).slice().reverse().forEach((obj, idx) => {
                const realIdx = canvas.getObjects().indexOf(obj);
                const li = document.createElement('li');
                li.className = `layer-item ${activeObj === obj ? 'selected' : ''}`;

                const visibilityIcon = obj.visible ? '👁️' : '🕶️';

                li.innerHTML = `
                    <span onclick="selectLayer(${realIdx})">${obj.type} ${realIdx + 1}</span>
                    <div class="layer-actions">
                        <button class="layer-btn" onclick="event.stopPropagation(); toggleVisibility(${realIdx})" title="Toggle Visibility">${visibilityIcon}</button>
                        <button class="layer-btn" onclick="event.stopPropagation(); moveLayerIdx(${realIdx}, 'up')" title="Move Up">🔼</button>
                        <button class="layer-btn" onclick="event.stopPropagation(); moveLayerIdx(${realIdx}, 'down')" title="Move Down">🔽</button>
                        <button class="layer-btn" onclick="event.stopPropagation(); deleteLayer(${realIdx})" title="Delete">🗑️</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function selectLayer(idx) {
            const obj = canvas.getObjects()[idx];
            if (!obj) return;
            canvas.setActiveObject(obj);
            canvas.requestRenderAll();
            updateLayerList();
        }

        function toggleVisibility(idx) {
            const obj = canvas.getObjects()[idx];
            if (!obj) return;
            obj.set('visible', !obj.visible);
            canvas.requestRenderAll();
            updateLayerList();
            saveHistory();
        }

        function moveLayerIdx(idx, dir) {
            const obj = canvas.getObjects()[idx];
            if (!obj) return;
            if (dir === 'up') obj.bringForward();
            else obj.sendBackwards();
            canvas.requestRenderAll();
            updateLayerList();
            saveHistory();
        }

        function deleteLayer(idx) {
            const obj = canvas.getObjects()[idx];
            if (!obj) return;
            canvas.remove(obj);
            canvas.requestRenderAll();
            updateLayerList();
            saveHistory();
        }

        function moveLayer(dir) {
            const obj = canvas.getActiveObject();
            if (obj) {
                dir === 'front' ? obj.bringToFront() : obj.sendToBack();
                canvas.requestRenderAll();
                saveHistory();
            }
        }

        function toggleLock() {
            const obj = canvas.getActiveObject();
            if (obj) {
                const L = !obj.lockMovementX;
                obj.set({ lockMovementX: L, lockMovementY: L, lockScalingX: L, lockScalingY: L, hasControls: !L });
                document.getElementById('lockBtn').classList.toggle('active', L);
                canvas.requestRenderAll();
                saveHistory();
            }
        }

        function toggleSnap() { snapToGrid = !snapToGrid; document.getElementById('snapBtn').classList.toggle('active', snapToGrid); }

        function toggleDrawer(id) {

            document.getElementById(id).classList.toggle('open');

        function toggleFullscreen() {

                showToast('Fullscreen only works inside the desktop app.');

        // ============ IMPORT / EXPORT / REFRESH ============
        function importLocalMedia(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    img.scaleToWidth(Math.min(400, canvas.getWidth() / 2));
                    const center = canvas.getCenter();
                    img.set({ left: center.left, top: center.top, originX: 'center', originY: 'center' });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                    canvas.requestRenderAll();
                    saveHistory();
                    syncRemoveBgButton();  // programmatic selection doesn't fire selection events
                    showToast('Image imported — Local AI tools are ready for it.');
                });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function refreshWorkspace() {
            if (confirm("Refresh workspace? This destroys the current canvas and starts fresh.")) {

        // ============ FILTERS ============
        function applyFilters() {

                new fabric.Image.filters.Brightness({ brightness: parseFloat(document.getElementById('bS').value) }),
                new fabric.Image.filters.Contrast({ contrast: parseFloat(document.getElementById('cS').value) }),

        function setFilterPreset(type) {

            if (!obj || obj.type !== 'image') { showToast('Select an image first.'); return; }
            obj.filters = [];
            if (type === 'grayscale') obj.filters.push(new fabric.Image.filters.Grayscale());
            if (type === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
