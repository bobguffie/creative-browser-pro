        // ============ AI REMOVE BACKGROUND (via main process; key never in renderer) ============
        function removeBackground() {
            const obj = canvas.getActiveObject();
            if (!obj || obj.type !== 'image') {
                showToast('Select an image first.');
                return;
            }
            const btn = document.getElementById('removeBgBtn');
            if (btn) { btn.disabled = true; btn.innerText = '✨ Processing…'; }
            const finish = () => { if (btn) { btn.innerText = '✨ Remove BG'; btn.disabled = false; syncRemoveBgButton(); } };

            if (!window.electron || !window.electron.send) {
                showToast('AI Remove BG only works inside the desktop app.');
                finish();
                return;
            }
            window.__aiPending = true;
            window.electron.send('ai-remove-bg-request', {
                base64: obj.toDataURL({ format: 'png' }).split(',')[1]
            });
            setTimeout(() => {
                if (window.__aiPending) {
                    window.__aiPending = false;
                    showToast('AI request timed out.');
                    finish();
                }
            }, 120000);
        }

        function syncRemoveBgButton() {
            if (!canvas) return;
            const obj = canvas.getActiveObject();
            const isImg = !!(obj && obj.type === 'image');
            const btn = document.getElementById('removeBgBtn');
            if (btn) {
                btn.disabled = !isImg;
                btn.title = isImg ? 'Remove background with AI (needs GEMINI_API_KEY in .env)' : 'Select an image first';
            }
            // Local AI buttons track the same selection state.
            if (typeof LOCAL_AI === 'undefined' || !LOCAL_AI.ramOk) return;
            const localBtn = document.getElementById('aiRemoveBgLocalBtn');
            const mlBtn = document.getElementById('aiMagicLayersBtn');
            if (localBtn && !LOCAL_AI.busy) {
                localBtn.disabled = !isImg;
                localBtn.title = isImg ? 'Remove background on-device' : 'Select an image first (click it so it has the selection frame)';
            }
            if (mlBtn && !LOCAL_AI.busy) {
                mlBtn.disabled = !isImg;
                mlBtn.title = isImg ? 'Slice the image into object layers on-device' : 'Select an image first (click it so it has the selection frame)';
            }
        }

        // ============ IPC RECEIVE (single bridge) ============

        // Fetch remote images through the main process (no CORS taint).
        function fetchImageBuffer(url) {
            return new Promise((resolve, reject) => {
                if (!window.electron || !window.electron.send) { reject(new Error('Desktop app required.')); return; }
                fetchImageBuffer._id = (fetchImageBuffer._id || 0) + 1;
                const myId = fetchImageBuffer._id;
                fetchImageBuffer._pending = fetchImageBuffer._pending || {};
                fetchImageBuffer._pending[myId] = { resolve, reject };
                window.electron.send('fetch-image', url);
                setTimeout(() => {
                    if (fetchImageBuffer._pending[myId]) {
                        delete fetchImageBuffer._pending[myId];
                        reject(new Error('Image fetch timed out.'));
                    }
                }, 30000);
            });
        }

        if (window.electron && window.electron.on) {
            window.electron.on('fetch-image-result', (payload) => {
                const pending = fetchImageBuffer._pending || {};
                for (const id of Object.keys(pending)) {
                    const p = pending[id];
                    delete pending[id];
                    payload.ok ? p.resolve(payload) : p.reject(new Error(payload.error || 'Fetch failed.'));
                }
            });

            // Image sent from another quadrant (right-click menu) or dropped in.
            window.electron.on('clipboard-image', (url) => {
                if (/^data:/.test(url)) {
                    addImageFromURL(url, 100, 100);
                    return;
                }
                fetchImageBuffer(url).then(({ buffer }) => {
                    addImageFromURL(URL.createObjectURL(new Blob([buffer])), 100, 100, true);
                }).catch(err => showToast('Could not load image: ' + err.message));
            });

            window.electron.on('ai-remove-bg-result', (payload) => {
                window.__aiPending = false;
                const btn = document.getElementById('removeBgBtn');
                const finish = () => { if (btn) { btn.innerText = '✨ Remove BG'; btn.disabled = false; syncRemoveBgButton(); } };
                if (!payload || !payload.ok) {
                    showToast((payload && payload.error) || 'AI processing failed.');
                    finish();
                    return;
                }
                const old = canvas.getActiveObject();
                fabric.Image.fromURL('data:image/png;base64,' + payload.resultBase64, (newImg) => {
                    if (!newImg || !newImg.width) { showToast('AI returned an invalid image.'); finish(); return; }
                    newImg.set({
                        left: old.left, top: old.top,
                        scaleX: old.scaleX, scaleY: old.scaleY,
                        angle: old.angle, originX: 'center', originY: 'center'
                    });
                    canvas.remove(old);
                    canvas.add(newImg);
                    canvas.setActiveObject(newImg);
                    canvas.requestRenderAll();
                    saveHistory();
                    showToast('Background removed.');
                    finish();
                });
            });
        }

        // ============ LOCAL AI (on-device BiRefNet + SAM2) ============
        const LOCAL_AI = {
            worker: null,
            ready: false,
            ramOk: (navigator.deviceMemory === undefined || navigator.deviceMemory >= 4) &&
                   (navigator.hardwareConcurrency === undefined || navigator.hardwareConcurrency >= 4),
            ramMsg: 'Local AI needs ~8GB system RAM. This device looks under-powered, so it is disabled.',
            busy: false,
            mode: localStorage.getItem('ai-device-mode') || 'auto',
            requestCounter: 0,
            pending: new Map(),
        };

        function initLocalAi() {
            const bg = document.getElementById('aiRemoveBgLocalBtn');
            const ml = document.getElementById('aiMagicLayersBtn');
            if (!LOCAL_AI.ramOk) {
                [bg, ml].forEach(b => { b.title = LOCAL_AI.ramMsg; b.innerText = '⛔ ' + b.innerText.slice(2); });
                document.getElementById('aiStatus').textContent = LOCAL_AI.ramMsg;
                return;
            }
            LOCAL_AI.worker = new Worker('local-ai-worker.mjs', { type: 'module' });
            LOCAL_AI.worker.onmessage = (e) => handleAiWorkerMessage(e.data);
            LOCAL_AI.worker.onerror = (e) => {
                aiSetStatus('AI worker failed: ' + (e.message || 'unknown error'));
            };
            LOCAL_AI.worker.postMessage({ type: 'config', payload: { mode: LOCAL_AI.mode } });
        }

        function handleAiWorkerMessage(msg) {
            const S = document.getElementById('aiStatus');
            const bar = document.getElementById('aiProgressBar');
            const fill = document.getElementById('aiProgressFill');
            switch (msg.type) {
                case 'device':
                    const p = msg.probe || {};
                    document.getElementById('aiProbeInfo').textContent =
                        `WebGPU: ${p.available ? 'available' : 'unavailable'}${p.reason ? ' (' + p.reason + ')' : ''}`;
                    updateDeviceButtons();
                    break;
                case 'status':
                    S.textContent = msg.message || '';
                    if (msg.phase === 'run') {
                        bar.style.display = 'block';
                        fill.style.width = msg.message.includes('%') ? msg.message.match(/\d+/)[0] + '%' : '50%';
                    } else if (msg.phase === 'init') {
                        bar.style.display = 'block';
                        fill.style.width = '0%';
                    }
                    break;
                case 'download':
                    if (msg.total > 0) {
                        fill.style.width = Math.round(msg.progress) + '%';
                        S.textContent = 'Downloading AI Engine… ' + Math.round(msg.progress) + '%';
                    }
                    break;
                case 'ready':
                    LOCAL_AI.ready = true;
                    S.textContent = 'AI engine ready (' + msg.device.toUpperCase() + ').';
                    enableLocalAiButtons();
                    break;
                case 'done': {
                    const pending = LOCAL_AI.pending.get(msg.id);
                    LOCAL_AI.pending.delete(msg.id);
                    LOCAL_AI.busy = false;
                    bar.style.display = 'none';
                    S.textContent = '';
                    if (pending) pending(msg);
                    break;
                }
                case 'error':
                    LOCAL_AI.busy = false;
                    bar.style.display = 'none';
                    S.textContent = '';
                    showToast('Local AI error: ' + msg.message);
                    console.error('[LocalAI]', msg.stack || msg.message);
                    break;
            }
        }

        function enableLocalAiButtons() {
            document.getElementById('aiRemoveBgLocalBtn').disabled = false;
            document.getElementById('aiMagicLayersBtn').disabled = false;
        }

        function aiSetStatus(text) {
            document.getElementById('aiStatus').textContent = text;
        }

        function toggleAiGear() {
            const m = document.getElementById('aiGearMenu');
            m.style.display = (m.style.display === 'none') ? 'block' : 'none';
        }

        function updateDeviceButtons() {
            ['auto', 'gpu', 'cpu'].forEach(mode => {
                const b = document.getElementById('devBtn-' + mode);
                if (b) b.classList.toggle('active', LOCAL_AI.mode === mode);
            });
            document.getElementById('aiDeviceLabel').textContent = 'Engine: ' +
                ({ auto: 'Auto', gpu: 'GPU Only', cpu: 'CPU Only' }[LOCAL_AI.mode]);
        }

        function setDeviceMode(mode) {
            LOCAL_AI.mode = mode;
            localStorage.setItem('ai-device-mode', mode);
            updateDeviceButtons();
            // Changing execution environment reloads the models on that device.
            LOCAL_AI.ready = false;
            document.getElementById('aiRemoveBgLocalBtn').disabled = true;
            document.getElementById('aiMagicLayersBtn').disabled = true;
            LOCAL_AI.worker.postMessage({ type: 'config', payload: { mode } });
            showToast('AI engine set to ' + mode.toUpperCase() + '. Models will load on next use.');
        }

        function aiRequest(type, payload, onDone) {
            if (!LOCAL_AI.worker || LOCAL_AI.busy) {
                if (LOCAL_AI.busy) showToast('AI is already processing. Please wait.');
                return;
            }
            LOCAL_AI.busy = true;
            const id = ++LOCAL_AI.requestCounter;
            LOCAL_AI.pending.set(id, onDone);
            LOCAL_AI.worker.postMessage({ type, id, payload });
        }

        async function getImageBuffer(obj) {
            // Read the image's source bytes in the renderer. Works for blob:
            // URLs (main-process fetched images) and data: URLs (file import).
            const src = obj.getSrc ? obj.getSrc() : obj.toDataURL();
            const resp = await fetch(src);
            return await resp.arrayBuffer();
        }

        async function localAiRemoveBg() {
            const obj = canvas.getActiveObject();
            if (!obj || obj.type !== 'image') { showToast('Select an image first (click it so it has the selection frame).'); return; }
            const btn = document.getElementById('aiRemoveBgLocalBtn');
            btn.disabled = true; btn.innerText = '🪄 Processing…';
            const finish = () => { btn.innerText = '🪄 Remove Background (Local AI)'; syncRemoveBgButton(); };
            let buffer;
            try { buffer = await getImageBuffer(obj); }
            catch (err) { showToast('Could not read this image: ' + err.message); finish(); return; }
            aiRequest('remove-bg', { imageBuffer: buffer }, (msg) => {
                fabric.Image.fromURL(URL.createObjectURL(msg.blob), (newImg) => {
                    if (!newImg || !newImg.width) { showToast('AI returned an invalid image.'); finish(); return; }
                    // Preserve the original's placement and on-canvas size.
                    newImg.set({
                        left: obj.left, top: obj.top,
                        scaleX: (obj.scaleX * obj.width) / newImg.width,
                        scaleY: (obj.scaleY * obj.height) / newImg.height,
                        angle: obj.angle, originX: obj.originX, originY: obj.originY
                    });
                    canvas.remove(obj);
                    canvas.add(newImg);
                    canvas.setActiveObject(newImg);
                    canvas.requestRenderAll();
                    saveHistory();
                    showToast('Background removed (' + (msg.engine || msg.device) + '). If the result looks wrong, the photo may need GPU mode.');
                    finish();
                });
            });
        }

        async function localAiMagicLayers() {
            const obj = canvas.getActiveObject();
            if (!obj || obj.type !== 'image') { showToast('Select an image first.'); return; }
            const btn = document.getElementById('aiMagicLayersBtn');
            btn.disabled = true; btn.innerText = '🧩 Processing…';
            const finish = () => { btn.innerText = '🧩 Split into Magic Layers (Local AI)'; syncRemoveBgButton(); };
            let buffer;
            try { buffer = await getImageBuffer(obj); }
            catch (err) { showToast('Could not read this image: ' + err.message); finish(); return; }
            // Placement geometry of the source image on the canvas.
            // getImageBuffer() downsamples to ≤768px inside the worker, so
            // mask coords are relative to that ANALYSIS size, not the source
            // file — the worker reports it as imageWidth/imageHeight.
            const imgLeft = obj.left, imgTop = obj.top;
            const imgW = obj.width * obj.scaleX, imgH = obj.height * obj.scaleY;
            aiRequest('magic-layers', { imageBuffer: buffer }, async (msg) => {
                if (!msg.layers || !msg.layers.length) {
                    showToast('No objects found in this image.');
                    finish();
                    return;
                }
                // Source-frame (obj's own pixel space) → canvas mapping.
                // obj.left/top are the CENTER when origin is center.
                const srcLeft = imgLeft - (obj.originX === 'center' ? obj.width * obj.scaleX / 2 : 0);
                const srcTop = imgTop - (obj.originY === 'center' ? obj.height * obj.scaleY / 2 : 0);
                const sx = imgW / obj.width;   // canvas px per source px
                const sy = imgH / obj.height;
                const added = [];
                for (const layer of msg.layers) {
                    const url = URL.createObjectURL(layer.blob);
                    const img = await new Promise((res) => fabric.Image.fromURL(url, res));
                    URL.revokeObjectURL(url);
                    if (!img || !img.width) continue;
                    // layer.left/top are in ANALYSIS coords (0..imageWidth).
                    // → source coords: multiply by (srcW / analysisW).
                    const scaleToSrc = obj.width / msg.imageWidth;
                    img.set({
                        left: srcLeft + layer.left * scaleToSrc * sx,
                        top: srcTop + layer.top * scaleToSrc * sy,
                        originX: 'left', originY: 'top'
                    });
                    canvas.add(img);
                    added.push(img);
                }
                canvas.remove(obj);
                if (added.length) {
                    const sel = new fabric.ActiveSelection(added, { canvas: canvas });
                    canvas.setActiveObject(sel);
                }
                canvas.requestRenderAll();
                saveHistory();
                showToast(`Magic Layers: ${added.length} objects extracted.`);
                finish();
            });
        }

        function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        // Boot the Local AI engine (button enablement happens on 'ready').
        initLocalAi();

        // ============ SLICE (cookie-cutter) ============
        function sliceGroup() {
            const active = canvas.getActiveObject();
            if (!active || active.type !== 'activeSelection') {
                showToast('Select both the shape and the image to slice (drag a box around both).');
                return;
            }

            const objects = active.getObjects();
            const shape = objects.find(o => o.type !== 'image');
            const target = objects.find(o => o.type === 'image');

            if (!shape || !target) {
                showToast('Please select one shape and one image.');
                return;
            }

            const shapeMatrix = shape.calcTransformMatrix();
            const targetMatrix = target.calcTransformMatrix();

            const shapePos = fabric.util.transformPoint({ x: 0, y: 0 }, shapeMatrix);
            const targetPos = fabric.util.transformPoint({ x: 0, y: 0 }, targetMatrix);

            const getAbsProps = (obj) => {
                let sX = obj.scaleX, sY = obj.scaleY, angle = obj.angle;
                let curr = obj.group;
                while (curr) {
                    sX *= curr.scaleX;
                    sY *= curr.scaleY;
                    angle += curr.angle;
                    curr = curr.group;
                }
                return { scaleX: sX, scaleY: sY, angle: angle };
            };

            const sProps = getAbsProps(shape);
            const tProps = getAbsProps(target);

            shape.clone((clonedShape) => {
                const diffX = shapePos.x - targetPos.x;
                const diffY = shapePos.y - targetPos.y;

                const angleRad = fabric.util.degreesToRadians(-tProps.angle);
                const localX = diffX * Math.cos(angleRad) - diffY * Math.sin(angleRad);
                const localY = diffX * Math.sin(angleRad) + diffY * Math.cos(angleRad);

                clonedShape.set({
                    absolutePositioned: false,
                    left: localX / tProps.scaleX,
                    top: localY / tProps.scaleY,
                    scaleX: sProps.scaleX / tProps.scaleX,
                    scaleY: sProps.scaleY / tProps.scaleY,
                    angle: sProps.angle - tProps.angle,
                    originX: 'center',
                    originY: 'center'
                });

                target.clone((clonedIn) => {
                    clonedIn.set({
                        clipPath: clonedShape,
                        left: targetPos.x,
                        top: targetPos.y,
                        scaleX: tProps.scaleX,
                        scaleY: tProps.scaleY,
                        angle: tProps.angle,
                        originX: 'center',
                        originY: 'center'
                    });

                    clonedShape.clone((clonedShapeOut) => {
                        clonedShapeOut.set({ inverted: true });
                        target.clone((clonedOut) => {
                            clonedOut.set({
                                clipPath: clonedShapeOut,
                                left: targetPos.x,
                                top: targetPos.y,
                                scaleX: tProps.scaleX,
                                scaleY: tProps.scaleY,
                                angle: tProps.angle,
                                originX: 'center',
                                originY: 'center'
                            });

                            canvas.add(clonedIn);
                            canvas.add(clonedOut);
                            canvas.remove(target);
                            canvas.remove(shape);
                            canvas.discardActiveObject();

                            canvas.setActiveObject(clonedIn);
                            canvas.requestRenderAll();
                            saveHistory();
                            showToast('Sliced into two pieces.');
                        });
                    });
                });
            });
        }

        // ============ WELD / UNWELD ============
        function weldObjects() {
            const active = canvas.getActiveObject();
            if (!active || active.type !== 'activeSelection') {
                showToast('Select multiple objects (drag a box) to weld.');
                return;
            }
            const group = active.toGroup();
            canvas.requestRenderAll();
            saveHistory();
            showToast('Welded into one object.');
        }

        function unweldObjects() {
            const active = canvas.getActiveObject();
            if (!active || active.type !== 'group') {
                showToast('Select a welded group to unweld.');
                return;
            }
            canvas.discardActiveObject();
            const items = active.getObjects().slice();
            active.ungroupOnCanvas();          // restore each member's absolute transform
            canvas.remove(active);             // take the group shell off the canvas
            items.forEach(o => canvas.add(o));
            const sel = new fabric.ActiveSelection(items, { canvas: canvas });
            canvas.setActiveObject(sel);
            canvas.requestRenderAll();
            saveHistory();
            showToast('Ungrouped.');
        }

        // ============ TEXT ============
        function addText() {
            const center = canvas.getCenter();
            const text = new fabric.IText('Double click to edit', {
                left: center.left,
                top: center.top,
                fill: document.getElementById('textColor').value,
                fontSize: parseInt(document.getElementById('fontSize').value),
                fontFamily: document.getElementById('fontFamily').value,
                originX: 'center',
                originY: 'center'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        function updateTextProperty(prop, value) {
            const obj = canvas.getActiveObject();
            if (obj && (obj.type === 'i-text' || obj.type === 'textbox' || obj.type === 'text')) {
                obj.set(prop, value);
                canvas.requestRenderAll();
                saveHistory();
            }
        }

        function toggleTextStyle(style) {
            const obj = canvas.getActiveObject();
            if (obj && (obj.type === 'i-text' || obj.type === 'textbox' || obj.type === 'text')) {
                if (style === 'bold') {
                    obj.set('fontWeight', obj.fontWeight === 'bold' ? 'normal' : 'bold');
                } else if (style === 'italic') {
                    obj.set('fontStyle', obj.fontStyle === 'italic' ? 'normal' : 'italic');
                } else if (style === 'underline') {
                    obj.set('underline', !obj.underline);
                }
                canvas.requestRenderAll();
                saveHistory();
            }
        }

        // ============ SHAPES ============
        function addRect() {
            const center = canvas.getCenter();
            canvas.add(new fabric.Rect({ left: center.left, top: center.top, fill: document.getElementById('fillColor').value, width: 100, height: 100, originX: 'center', originY: 'center' }));
        }
        function addCircle() {
            const center = canvas.getCenter();
            canvas.add(new fabric.Circle({ left: center.left, top: center.top, fill: document.getElementById('fillColor').value, radius: 50, originX: 'center', originY: 'center' }));
        }
        function addTriangle() {
            const center = canvas.getCenter();
            canvas.add(new fabric.Triangle({ left: center.left, top: center.top, fill: document.getElementById('fillColor').value, width: 100, height: 100, originX: 'center', originY: 'center' }));
        }
        function addHexagon() {
            const center = canvas.getCenter();
            const side = 50;
            const points = [];
            for (let i = 0; i < 6; i++) {
                points.push({ x: side * Math.cos(i * 2 * Math.PI / 6), y: side * Math.sin(i * 2 * Math.PI / 6) });
            }
            canvas.add(new fabric.Polygon(points, { left: center.left, top: center.top, fill: document.getElementById('fillColor').value, originX: 'center', originY: 'center' }));
        }
        function addHeart() {
            const center = canvas.getCenter();
            const path = "M 272.70141,238.71731 C 206.46141,238.71731 152.70141,292.47731 152.70141,358.71731 C 152.70141,493.47282 288.63461,528.41746 372.70141,702.71731 C 456.76811,528.41746 592.70141,493.47282 592.70141,358.71731 C 592.70141,292.47731 538.94141,238.71731 472.70141,238.71731 C 432.03771,238.71731 396.19321,258.99946 372.70141,289.84231 C 349.20961,258.99946 313.36511,238.71731 272.70141,238.71731 z";
            canvas.add(new fabric.Path(path, { left: center.left, top: center.top, fill: document.getElementById('fillColor').value, scaleX: 0.2, scaleY: 0.2, originX: 'center', originY: 'center' }));
        }
        function addPentagon() {
            const center = canvas.getCenter();
            const side = 50;
            const points = [];
            for (let i = 0; i < 5; i++) {
                points.push({ x: side * Math.cos(i * 2 * Math.PI / 5 - Math.PI / 2), y: side * Math.sin(i * 2 * Math.PI / 5 - Math.PI / 2) });
            }
            canvas.add(new fabric.Polygon(points, { left: center.left, top: center.top, fill: document.getElementById('fillColor').value, originX: 'center', originY: 'center' }));
        }
        function addOctagon() {
            const center = canvas.getCenter();
            const side = 50;
            const points = [];
            for (let i = 0; i < 8; i++) {
                points.push({ x: side * Math.cos(i * 2 * Math.PI / 8 - Math.PI / 8), y: side * Math.sin(i * 2 * Math.PI / 8 - Math.PI / 8) });
            }
            canvas.add(new fabric.Polygon(points, { left: center.left, top: center.top, fill: document.getElementById('fillColor').value, originX: 'center', originY: 'center' }));
        }
        function addCloud() {
            const center = canvas.getCenter();
            const path = "M 25,60 a 20,20 1 0,0 0,40 h 50 a 20,20 1 0,0 0,-40 a 10,10 1 0,0 -15,-10 a 15,15 1 0,0 -35,10 z";
            canvas.add(new fabric.Path(path, { left: center.left, top: center.top, fill: document.getElementById('fillColor').value, scaleX: 1.5, scaleY: 1.5, originX: 'center', originY: 'center' }));
        }
        function addStar() {
            const center = canvas.getCenter();
            canvas.add(new fabric.Polygon([{ x: 0, y: 0 }, { x: 10, y: 30 }, { x: 40, y: 30 }, { x: 15, y: 50 }, { x: 25, y: 80 }, { x: 0, y: 60 }, { x: -25, y: 80 }, { x: -15, y: 50 }, { x: -40, y: 30 }, { x: -10, y: 30 }], { left: center.left, top: center.top, fill: document.getElementById('fillColor').value, originX: 'center', originY: 'center' }));
        }

        function addFrameShape(type) {
            let shape;
            const common = { left: 200, top: 200, fill: '#333', opacity: 0.5, stroke: '#00ff00', strokeWidth: 2, strokeDashArray: [5, 5] };
            if (type === 'circle') shape = new fabric.Circle({ ...common, radius: 100 });
            if (type === 'rect') shape = new fabric.Rect({ ...common, width: 200, height: 150 });
            if (type === 'star') shape = new fabric.Polygon([{ x: 0, y: 0 }, { x: 10, y: 30 }, { x: 40, y: 30 }, { x: 15, y: 50 }, { x: 25, y: 80 }, { x: 0, y: 60 }, { x: -25, y: 80 }, { x: -15, y: 50 }, { x: -40, y: 30 }, { x: -10, y: 30 }], { ...common });
            if (type === 'heart') {
                const path = "M 272.70141,238.71731 C 206.46141,238.71731 152.70141,292.47731 152.70141,358.71731 C 152.70141,493.47282 288.63461,528.41746 372.70141,702.71731 C 456.76811,528.41746 592.70141,493.47282 592.70141,358.71731 C 592.70141,292.47731 538.94141,238.71731 472.70141,238.71731 C 432.03771,238.71731 396.19321,258.99946 372.70141,289.84231 C 349.20961,258.99946 313.36511,238.71731 272.70141,238.71731 z";
                shape = new fabric.Path(path, { ...common, scaleX: 0.3, scaleY: 0.3 });
            }
            shape.set('isFrame', true);
            canvas.add(shape);
            canvas.requestRenderAll();
        }

        function addFrame(type) {
            const active = canvas.getActiveObject();
            if (!active) {
                showToast('Select an object to frame.');
                return;
            }
            const bounds = active.getBoundingRect();
            let frame;

            if (type === 'classic') {
                frame = new fabric.Rect({
                    left: bounds.left - 10,
                    top: bounds.top - 10,
                    width: bounds.width + 20,
                    height: bounds.height + 20,
                    fill: 'transparent',
                    stroke: '#ffd700',
                    strokeWidth: 10,
                    rx: 5, ry: 5
                });
            } else if (type === 'modern') {
                frame = new fabric.Rect({
                    left: bounds.left - 5,
                    top: bounds.top - 5,
                    width: bounds.width + 10,
                    height: bounds.height + 10,
                    fill: 'transparent',
                    stroke: '#ffffff',
                    strokeWidth: 2
                });
            } else if (type === 'polaroid') {
                frame = new fabric.Rect({
                    left: bounds.left - 15,
                    top: bounds.top - 15,
                    width: bounds.width + 30,
                    height: bounds.height + 60,
                    fill: '#ffffff',
                    shadow: 'rgba(0,0,0,0.3) 5px 5px 10px'
                });
                active.bringToFront();
            }

            if (frame) {
                canvas.add(frame);
                if (type === 'polaroid') frame.sendToBack();
                canvas.requestRenderAll();
                saveHistory();
            }
        }

        // ============ IMAGE PLACEMENT HELPERS ============
        function addImageFromURL(url, left, top, revoke) {
            fabric.Image.fromURL(url, (img) => {
                if (revoke) URL.revokeObjectURL(url);
                if (!img || !img.width) { showToast('Could not decode that image.'); return; }
                img.set({ left: left, top: top, originX: 'center', originY: 'center' });
                canvas.add(img);
                canvas.setActiveObject(img);
                canvas.requestRenderAll();
                saveHistory();
                showToast('Image added to workspace.');
            });
        }

        function placeImageAt(img, pointer, targetFrame) {
            img.scaleToWidth(Math.min(300, canvas.getWidth() / 3));
            if (targetFrame) {
                const frameCenter = targetFrame.getCenterPoint();
                const frameScaleX = targetFrame.scaleX;
                const frameScaleY = targetFrame.scaleY;
                const frameAngle = targetFrame.angle;
                targetFrame.clone((clonedFrame) => {
                    clonedFrame.set({
                        left: 0, top: 0, scaleX: 1, scaleY: 1, angle: 0,
                        originX: 'center', originY: 'center', absolutePositioned: false
                    });
                    img.set({
                        clipPath: clonedFrame,
                        left: frameCenter.x, top: frameCenter.y,
                        scaleX: frameScaleX, scaleY: frameScaleY, angle: frameAngle,
                        originX: 'center', originY: 'center'
                    });
                    canvas.remove(targetFrame);
                    canvas.add(img);
                    canvas.setActiveObject(img);
                    canvas.requestRenderAll();
                    saveHistory();
                });
            } else {
                img.set({ left: pointer.x, top: pointer.y, originX: 'center', originY: 'center' });
                canvas.add(img);
                canvas.setActiveObject(img);
                canvas.requestRenderAll();
                saveHistory();
            }
        }

        // ============ DROP HANDLING ============
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', handleDrop);

        async function handleDrop(e) {
            e.preventDefault();
            const url = e.dataTransfer.getData('url') || e.dataTransfer.getData('text/plain');
            if (!url) { showToast('Nothing droppable here.'); return; }
            const pointer = canvas.getPointer(e);
            const targetFrame = canvas.getObjects().find(obj => obj.isFrame && obj.containsPoint(pointer));

            if (/^data:/.test(url)) {
                fabric.Image.fromURL(url, (img) => placeImageAt(img, pointer, targetFrame));
                return;
            }
            try {
                const { buffer } = await fetchImageBuffer(url);
                const objUrl = URL.createObjectURL(new Blob([buffer]));
                fabric.Image.fromURL(objUrl, (img) => {
                    URL.revokeObjectURL(objUrl);
                    placeImageAt(img, pointer, targetFrame);
                });
            } catch (err) {
                showToast('Could not load image: ' + err.message);
            }
        }

        // ============ SELECTION HELPERS (honest versions) ============
        function startRectSelect() {
            stopAllTools();
            canvas.add(new fabric.Rect({
                left: canvas.getWidth() / 2 - 100, top: canvas.getHeight() / 2 - 100, width: 200, height: 200,
                fill: 'rgba(0,255,0,0.1)', stroke: '#00ff00', strokeDashArray: [5, 5],
                isFrame: true
            }));
            showToast('Dashed mask shape added: drop an image into it, or Slice an image with it.');
        }

        function startLassoSelect() {
            stopAllTools();
            setBrush('Pencil');
            if (!canvas.isDrawingMode) toggleDrawingMode();
            showToast('Draw around an area, then use Slice with an image to cut it out.');
        }

        // ============ BOOT ============
        initCanvas();
        setTimeout(resizeCanvas, 300); // settle fonts/layout, then true up geometry
    </script>
