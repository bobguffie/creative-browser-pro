name: Build AppImage

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run dist -- --publish never
        env:
          # electron-builder needs a version for the AppImage metadata
          ELECTRON_BUILDER_VERSION: 24.13.3

      - name: Upload AppImage artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: CreativeBrowser-AppImage
          path: release/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.AppImage
          fail_on_unmatched_files: true
