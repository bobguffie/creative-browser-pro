name: Build AppImage

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run dist -- --publish never

      # v4.x latest is Node-24 native on current runners; the v5 major still
      # ships a node20 runtime for backward compat, so pin v4 line here.
      - name: Upload AppImage artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: CreativeBrowser-AppImage
          path: release/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.AppImage
          fail_on_unmatched_files: true
